name: Release
# Etiket atınca (örn. v0.4.3) Windows kurulum dosyasını üretip GitHub Release'e yükler.
# Uygulamanın "Güncellemeleri Denetle" özelliği bu Release'i kullanır:
#   AudiflySetup.exe + AudiflySetup.exe.sha256 (doğrulama için ZORUNLU).
# Kullanım:  pyproject.toml, constants.py (APP_VERSION) ve .iss sürümünü yükselt →
#            git tag v0.4.3 && git push origin v0.4.3
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          path: mustiefly_qt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Etiket sürümü pyproject ile aynı mı?
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $line = (Select-String -Path mustiefly_qt/pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $line) { throw "Etiket ($tag) ile pyproject sürümü ($line) farklı" }
          "VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: python -m pip install -e "./mustiefly_qt[dev]" pyinstaller pypresence ytmusicapi winsdk
      - run: python -m pytest -q mustiefly_qt/tests
      - run: python mustiefly_qt/packaging/make_icon.py
      - name: Node.js'i pakete ekle (yt-dlp YouTube çözümü için)
        run: python mustiefly_qt/packaging/fetch_node.py
      - name: libVLC'yi pakete ekle (kullanıcı ayrıca VLC kurmasın)
        run: python mustiefly_qt/packaging/fetch_vlc.py
      - run: pyinstaller --noconfirm mustiefly_qt/packaging/audifly.spec
      - name: Pakette Node.js, libVLC ve yt-dlp-ejs var mı?
        shell: pwsh
        run: |
          if (-not (Get-ChildItem dist/Audifly -Recurse -Filter node.exe)) { throw "node.exe pakete girmedi" }
          if (-not (Get-ChildItem dist/Audifly -Recurse -Filter libvlc.dll)) { throw "libvlc.dll pakete girmedi" }
          if (-not (Get-ChildItem dist/Audifly -Recurse -Filter core.min.js)) { throw "yt-dlp-ejs betikleri (core.min.js) pakete girmedi" }
      - name: Uygulama ikilisini imzala (sertifika tanımlıysa)
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: python mustiefly_qt/packaging/sign_binaries.py dist/Audifly/Audifly.exe
      - name: Inno Setup ile kurulum dosyası
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          python mustiefly_qt/packaging/set_iss_version.py $env:VERSION
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" mustiefly_qt/packaging/audifly.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC hata verdi (cikis kodu $LASTEXITCODE)" }
          if (-not (Test-Path mustiefly_qt/packaging/Output/AudiflySetup.exe)) { throw "AudiflySetup.exe üretilmedi" }
      - name: Kurulum dosyasını imzala (sertifika tanımlıysa)
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: python mustiefly_qt/packaging/sign_binaries.py mustiefly_qt/packaging/Output/AudiflySetup.exe
      - name: SHA-256 özeti
        shell: pwsh
        run: |
          $f = "mustiefly_qt/packaging/Output/AudiflySetup.exe"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "$h  AudiflySetup.exe" | Out-File -FilePath "$f.sha256" -Encoding ascii
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mustiefly_qt/packaging/Output/AudiflySetup.exe
            mustiefly_qt/packaging/Output/AudiflySetup.exe.sha256
          generate_release_notes: true
